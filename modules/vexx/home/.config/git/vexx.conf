# Кусок конфига git, который приносит модуль vexx.
#
# Подключается строкой `[include] path = ~/.config/git/vexx.conf` из
# ~/.config/git/config (модуль core). Отсутствующий include git молча
# игнорирует, поэтому на машине без модуля vexx ничего не происходит — а
# `core.editor = vexx` в общем конфиге ломал бы `git commit` без -m везде,
# где vexx не установлен (например, в devsy-контейнере).

[core]
	editor = vexx
