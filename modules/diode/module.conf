# diode — свой редактор (бывший vexx, переехал в diode-editor/diode). Бинарник
# ставится из apt (репа апстрима, см. README «diode»), dotfiles его не трогают.
# Здесь только то, что к нему прилагается: кусок конфига git с core.editor,
# diode-here и скил Клода «открыть в diode». Состояние (~/.vexx/user-data — имя
# внутри бинарника пока старое) и кэш бандла редактор держит вне ~/.config.
#
# requires появился вместе с переездом на apt: раньше бинарник ставил скрипт
# update этого же модуля, и требовать его наличия заранее было замкнутым кругом.
# Теперь редактор — обычная внешняя команда, как kitty у модуля kitty: нет её —
# модуль выпадает из плана с подсказкой, а не приносит core.editor, ломающий
# `git commit` без -m.

desc="diode: core.editor для git, diode-here и скил Клода «открыть в diode»"

requires="diode"

scripts=""
