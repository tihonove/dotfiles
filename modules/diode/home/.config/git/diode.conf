# Кусок конфига git, который приносит модуль diode.
#
# Подключается строкой `[include] path = ~/.config/git/diode.conf` из
# ~/.config/git/config (модуль core). Отсутствующий include git молча
# игнорирует, поэтому на машине без модуля diode ничего не происходит — а
# `core.editor = diode` в общем конфиге ломал бы `git commit` без -m везде,
# где diode не установлен (например, в devsy-контейнере).

[core]
	editor = diode
