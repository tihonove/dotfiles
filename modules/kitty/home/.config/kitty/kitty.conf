# vim:ft=kitty

# ── Шрифт ─────────────────────────────────────────────────────────────────────
# font_family не задан намеренно: kitty возьмёт monospace, а тот через
# ~/.config/fontconfig/fonts.conf указывает на JetBrainsMono Nerd Font.

# symbol_map основной шрифт не подменяет — он адресует отдельные кодпоинты, так
# что комментарий выше в силе.
#
# Эти диапазоны есть И в Symbola, И в Noto Color Emoji, а по цепочке фолбэков
# из fonts.conf их забирает Noto — и рисует цветными картинками не по метрикам
# сетки. В строке режима Claude Code (⏵⏵ accept edits on, ⏸ plan mode on) это
# выглядит инородно, поэтому прибиваем к монохромной Symbola явно.
#
# Диапазоны узкие намеренно. Весь блок U+2300-23FF прибивать нельзя: там ⌘ и ⌥,
# которые JetBrainsMono рисует сам и по своим метрикам.
#   U+23B8-U+23BF — вертикальные линейки и уголки дерева под вызовами тулов (⎿)
#   U+23F4-U+23FA — медиа-треугольники и индикатор режима (⏵ ⏸ ⏺)
symbol_map U+23B8-U+23BF,U+23F4-U+23FA Symbola

# ── Стартовый размер окна ──────────────────────────────────────────────────────
# Всегда открываться фиксированным размером, а не подстраиваться под прошлый.
# Размер задан в ЯЧЕЙКАХ (суффикс c) — значит окно всегда кратно сетке символов,
# без «обрезанных» полуячеек. resize_in_steps держит это выравнивание и при ресайзе.
remember_window_size  no
initial_window_width  120c
initial_window_height 35c

resize_in_steps yes

# ── Палитра ───────────────────────────────────────────────────────────────────
# Цветов тут больше нет: они переключаются вместе со светлой/тёмной темой всей
# сессии и живут в ~/.local/bin/theme-colors (Catppuccin Mocha / Latte).
#
# geninclude, а не include: kitty ЗАПУСКАЕТ указанную программу и берёт её
# stdout как конфиг — при каждой загрузке, в том числе по SIGUSR1. Значит файла
# с текущей темой на диске не нужно вообще, тема каждый раз спрашивается у
# gsettings. Переключает theme-toggle, разбор — ~/.system-setup/theme-light-dark.md
#
# Путь относительный — считается от каталога этого конфига. Если скрипт пропадёт,
# kitty напишет строку в лог и стартует с цветами по умолчанию.
geninclude theme.sh

# ── Гашение дефолтных шорткатов kitty ─────────────────────────────────────────
# Чтобы эти сочетания уходили в приложение (tmux, редактор), а не съедались kitty.
map ctrl+shift+left no_op
map ctrl+shift+right no_op
map ctrl+shift+up no_op
map ctrl+shift+down no_op
map ctrl+shift+home no_op
map ctrl+shift+end no_op
map ctrl+tab no_op
map ctrl+shift+tab no_op
map ctrl+shift+e no_op
map ctrl+shift+p no_op

# ── Copy/paste работают и в русской раскладке ──────────────────────────────────
# kitty матчит шорткаты по символу текущей раскладки, поэтому дублируем биндинги
# на кириллицу тех же физических клавиш (ЙЦУКЕН: C→с, V→м, X→ч).
map ctrl+shift+с copy_to_clipboard
map ctrl+shift+м paste_from_clipboard

clipboard_control write-clipboard write-primary read-clipboard read-primary

# Не перенесено из старого конфига:
#   Super → tmux (22 маппинга) — отложено до переноса tmux: без user-keys в
#     .tmux.conf схема бесполезна, а Super+1..9 сейчас заняты столами sway.
#   allow_remote_control / listen_on и ssh.conf с forward_remote_control —
#     решено не переносить вообще, см. README.
