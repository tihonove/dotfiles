# Настройки kitten ssh. Читается автоматически при `kitten ssh <хост>`.
#
# Про forward_remote_control тут нет и не будет — см. README, «Сознательно не
# переносим»: отдавать удалённому хосту управление локальным kitty мы не хотим
# ни в каком виде.

hostname *.devsy
# Выключаем только разметку промпта, всё остальное (terminfo, курсор, заголовок,
# автодополнение) остаётся.
#
# Зачем: базовый образ devcontainer собирает PS1 многострочной строкой в
# обратных кавычках — внутри неё настоящие переводы строк (13 штук). kitty
# видит перевод строки, считает промпт многострочным и вставляет метку
# вторичного промпта по ПОСЛЕДНЕМУ переводу. А последний приходится на середину
# подстановки, между `fi` и остальным телом, — подстановка рвётся, и каждый
# промпт печатает:
#
#   bash: command substitution: line 12: syntax error: unexpected end of file
#   from `if' command on line 2
#
# Причина не в наших конфигах: PS1 там побайтово одинаков с нашим блоком в
# ~/.bashrc и без него. Чинить чужой образ в каждом новом контейнере — не
# вариант, поэтому глушим со своей стороны.
shell_integration no-prompt-mark
