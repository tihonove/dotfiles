# devsy — удалённые дев-воркспейсы. Здесь же ~/.ssh/config: он почти целиком
# про то, как заводится хост воркспейса. И скилы Клода про эти же воркспейсы —
# лежат тут, а не в отдельном модуле, чтобы на машине без devsy не всплывать.
#
# requires пуст намеренно. Прописать сюда devsy значило бы запретить включение
# модуля до установки бинаря — а вместе с ним и ssh-конфига. Скрипт setup сам
# честно падает с «devsy не установлен, запусти update-tools.sh».

desc="devsy: ssh-конфиг, настройка ssh-провайдера, скилы Клода про воркспейсы"

requires=""

scripts="update setup"
