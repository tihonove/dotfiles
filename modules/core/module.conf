# Описание модуля. Подключается install.sh через `.`, поэтому здесь только
# присваивания — никаких команд.
#
#   desc     — строка для ./install.sh list
#   requires — команды, без которых модуль бессмыслен. Проверяются command -v
#              на предполётной проверке: модуль включён, а бинаря нет — отказ,
#              а не тихий пропуск.

desc="база: bash, ble.sh, fzf, starship, tmux, btop, палитра темы"

# У core требований нет намеренно: он должен вставать на любой машине, а всё,
# что зависит от окружения, уезжает отсюда в отдельные модули.
requires=""

scripts="update"

# tmux сюда же, и тоже без requires: конфиг на машине без tmux — просто лишний
# файл, а вот отказ ставить весь core из-за отсутствующего tmux был бы уже
# вредом. Плагин темы вендорится рядом, в .local/share/tmux/catppuccin.
#
# btop по той же причине без requires. Конфига у него три строки, всё остальное
# — тема, а тему пишет theme-colors, который и так живёт здесь.

# theme-colors лежит здесь, а не в sway, хотя тема — часть сессии. На него
# опирается kitty (theme.sh -> theme-colors kitty), и модулю kitty незачем
# тащить за собой весь sway ради палитры. Сам скрипт этой планке соответствует:
# чистая функция «палитра на stdout», ни одной внешней зависимости.
