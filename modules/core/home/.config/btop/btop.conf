#? Config file for btop v. 1.4.6

# Здесь лежит только то, что отличается от дефолтов. Остальные ключи btop
# подставляет сам, и держать их копию в репе смысла нет: конфиг btop — это
# полный дамп всех настроек с комментариями (девять килобайт), в котором три
# осмысленные строки терялись бы бесследно.
#
# Полный список ключей с пояснениями отдельным файлом пакет не кладёт (в
# /usr/share/btop только themes), но его печатает сам btop:
#
#   btop --default-config

#* Тема. Имя без расширения, btop ищет catppuccin.theme в ~/.config/btop/themes
#* и в /usr/share/btop/themes. Файл производный, в git его нет: палитру пишет
#* туда theme-colors (цель btop), а обновляет при переключении темы
#* `theme-toggle refresh` — ровно как colors.css у waybar.
#*
#* Поэтому имя тут фиксированное и не меняется вместе с темой: светлая и тёмная
#* отличаются содержимым файла, а не его именем. Так этот конфиг остаётся
#* статикой, а всё изменчивое живёт в одном месте — в theme-colors.
#*
#* Если файла нет (машина без sway, где никто не звал refresh, — его на такой
#* случай пишет ещё и modules/core/update), btop молча берёт тему Default.
color_theme = "catppuccin"

#* Не перезаписывать конфиг при выходе. Ключевая строка: файл — симлинк в репу
#* dotfiles, а btop по умолчанию пишет его целиком на каждом выходе, вместе с
#* рантайм-состоянием вроде выбранной сортировки процессов. Симлинк он при этом
#* сохраняет, так что рабочая копия репы становилась бы грязной после каждого
#* запуска монитора.
#*
#* Плата — настройки, натыканные мышкой в меню Options, живут до выхода. Меняем
#* их здесь, руками; для трёх строк это честный размен.
save_config_on_exit = false
