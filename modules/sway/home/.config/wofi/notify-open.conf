# Список уведомлений. Вызывается из ~/.local/bin/notify-open, не напрямую.
#
# Отдельный файл — по той же причине, что и clip-history.conf: соседний `config`
# жёстко задаёт show=drun, и полагаться на то, что --dmenu переспорит show=,
# не хочется.
#
# Стиль НЕ задаём: дефолт wofi и так ~/.config/wofi/style.css — тот самый файл,
# который theme-toggle refresh собирает из style.css.in и палитры. Список
# уведомлений выглядит как лаунчер не потому, что тема похожа, а потому что она
# буквально одна и та же.

show=dmenu

### Геометрия
# Шире лаунчера и истории буфера (600): в строке время, приложение, заголовок и
# начало текста — на 600 всё это обрывается на полуслове.
width=900
lines=10
location=center

### Поведение
prompt=»
insensitive=true
matching=fuzzy
hide_scroll=true
gtk_dark=true

# Возвращать НОМЕР строки вместо её текста: скрипт держит id и имена приложений
# в массивах того же порядка и берёт по индексу. Разбирать текст обратно нельзя
# — в нём произвольное содержимое уведомления.
#
# Префикс dmenu- обязателен: опции конкретного режима без него молча
# игнорируются (wofi(5), «Mode specific options»).
dmenu-print_line_num=true

### Иконки
# Выключены, как и в лаунчере: у сессии плоский текстовый вид. Картинки включены
# только в истории буфера, и там они по делу — превью скриншотов.
allow_images=false
