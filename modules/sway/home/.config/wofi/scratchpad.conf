# Спрятанные окна scratchpad. Вызывается из ~/.local/bin/scratchpad, не напрямую.
#
# Отдельный файл — по той же причине, что и clip-history.conf: в соседнем `config`
# стоит show=drun. Стиль общий, ~/.config/wofi/style.css.

show=dmenu

### Геометрия — как у лаунчера
width=600
lines=10
location=center

### Поведение
prompt=»
insensitive=true
matching=fuzzy
hide_scroll=true
gtk_dark=true
allow_images=false

# Возвращать номер строки, а не текст: в заголовке окна может быть что угодно.
# Префикс dmenu- обязателен, см. clip-history.conf.
dmenu-print_line_num=true
