# Очередь ytm. Вызывается из ~/.local/bin/ytm-bar menu (ПКМ по названию в
# waybar), не напрямую. Стиль общий, ~/.config/wofi/style.css.

show=dmenu

### Геометрия
# Названия треков длинные, очередь от радио — десятки пунктов.
width=600
lines=15
location=center

### Поведение
prompt=»
insensitive=true
matching=fuzzy
hide_scroll=true
gtk_dark=true
allow_images=false
