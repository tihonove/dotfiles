# Меню питания. Вызывается из ~/.local/bin/power-menu, не напрямую.
#
# Отдельный файл по той же причине, что и notify-open.conf: в соседнем `config`
# стоит show=drun. Стиль общий, ~/.config/wofi/style.css.

show=dmenu

### Геометрия
# Пять пунктов: окно ровно под них, без пустого места снизу.
width=300
lines=5
location=center

### Поведение
prompt=»
insensitive=true
matching=fuzzy
hide_scroll=true
gtk_dark=true
allow_images=false
