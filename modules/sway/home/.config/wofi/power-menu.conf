# Меню питания. Вызывается из ~/.local/bin/power-menu, не напрямую.
#
# Отдельный файл по той же причине, что и notify-open.conf: в соседнем `config`
# стоит show=drun. Стиль общий, ~/.config/wofi/style.css.

show=dmenu

### Геометрия
# Пять пунктов. Высота в пикселях, а не lines=5: lines wofi пересчитывает по
# своей оценке высоты строки без отступов из style.css, и на NB-PF66E62Q окно
# вмещало только три пункта — «Перезагрузить» и «Выйти из sway» уходили под
# скрытый скролл. 230 = поле ввода + 5 строк по ~32px + рамки.
width=300
height=230
location=center

### Поведение
prompt=»
insensitive=true
matching=fuzzy
hide_scroll=true
gtk_dark=true
allow_images=false
