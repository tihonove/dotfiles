# Выбор машины для tmux-сессии. Вызывается из ~/.local/bin/tmux-go, не напрямую.
#
# Отдельный файл — по той же причине, что и clip-history.conf: соседний `config`
# жёстко задаёт show=drun, и полагаться на то, что --dmenu переспорит show=,
# не хочется.
#
# Стиль НЕ задаём: дефолт wofi и так ~/.config/wofi/style.css — тот самый файл,
# который theme-toggle refresh собирает из style.css.in и палитры. Список машин
# выглядит как лаунчер, потому что тема буквально одна и та же.

show=dmenu

### Геометрия — ровно как у drun: список короткий, имена машин — одно слово
width=600
lines=10
location=center

### Поведение
prompt=ssh
insensitive=true
matching=fuzzy
hide_scroll=true
gtk_dark=true

# Возвращать текст строки, а не номер: строка и есть имя хоста, а набранное
# мимо списка имя тоже должно уходить в ssh как есть.

### Иконки
# Выключены, как и в лаунчере: у сессии плоский текстовый вид.
allow_images=false
