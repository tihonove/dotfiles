# История буфера обмена. Вызывается из ~/.local/bin/clip-history, не напрямую.
#
# Почему отдельный файл, а не флаги в строке запуска: соседний `config` жёстко
# задаёт show=drun, и полагаться на то, что --dmenu переспорит show=, не хочется.
# Заодно это та же логика, что и там — режим живёт в конфиге, а не в вызове.
#
# Стиль НЕ задаём: дефолт wofi и так ~/.config/wofi/style.css, тот самый файл,
# который theme-toggle refresh собирает из style.css.in и палитры. Это и есть
# ответ на «пусть выглядит как лаунчер»: не похожая тема, а буквально она же.

show=dmenu

### Геометрия — ровно как у drun, чтобы окна не прыгали друг относительно друга
width=600
lines=10
location=center

### Поведение
prompt=»
insensitive=true
matching=fuzzy
hide_scroll=true
gtk_dark=true

# Возвращать НОМЕР выбранной строки вместо её текста. Нумерация с нуля
# (проверено на wofi 1.5.1).
#
# Иначе пришлось бы разбирать обратно `img:/путь:text:превью` — а превью это
# произвольное содержимое буфера, в котором двоеточий может быть сколько угодно,
# и любая такая строка ломала бы разбор. С номером разбирать нечего: скрипт
# держит массив id в том же порядке и берёт по индексу.
#
# Префикс dmenu- обязателен: опции конкретного режима без него молча
# игнорируются (wofi(5), «Mode specific options»).
dmenu-print_line_num=true

### Картинки
# Включены — ради превью скриншотов; в drun они, наоборот, выключены намеренно.
allow_images=true
# 48px: картинку узнать можно, а текстовые записи (их в истории большинство)
# не раздуваются втрое. Скрипт готовит миниатюры под этот размер, см. THUMB.
image_size=48
