# Какие бэкенды xdg-desktop-portal использовать под sway. Файл выбирается по
# XDG_CURRENT_DESKTOP=sway (его ставит exec_always в ~/.config/sway/config).
#
# Без него Settings (org.freedesktop.portal.Settings, ключ color-scheme) отдаёт
# пустоту — тему не увидят ни Chrome, ни Electron, ни GTK, см. theme-toggle.
# default=gtk закрывает Settings, FileChooser, Notification и прочее,
# wlr — только захват экрана (шаринг в Chrome/Slack, пакет xdg-desktop-portal-wlr).
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
