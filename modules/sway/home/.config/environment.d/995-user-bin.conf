# ~/.local/bin в PATH графической сессии. Бинды sway (kitty, tmux-go,
# power-menu, shot…) и сервисы systemd --user запускаются не из login-shell,
# ~/.profile для них не читается — PATH берётся из окружения systemd --user,
# а его собирает генератор из environment.d. Без этого файла $mod+Enter молча
# ничего не открывает: `sh: kitty: not found` в journalctl --user.
#
# Раньше работало случайно: в той же загрузке первым заходили в GNOME, он
# затягивал ~/.profile в окружение systemd --user, и sway, запущенный позже,
# его наследовал. Чистый вход в sway после ребута — и PATH голый.
#
# Имя с 995-: файлы читаются по алфавиту из всех каталогов разом, а
# /usr/lib/environment.d/99-environment.conf задаёт PATH целиком (копия
# /etc/environment), 990-snapd.conf добавляет /snap/bin — наш должен идти после.
PATH=$HOME/.local/bin:$PATH
