# Графическая сессия целиком. Разбивать бессмысленно: sway/config поднимает
# waybar и kanshi через exec_always, waybar падает без colors.css, который
# генерит theme-toggle, а wofi/style.css им же собирается из style.css.in.
#
# theme-colors живёт в core, а не здесь: на него опирается kitty (theme.sh),
# и модулю kitty незачем тащить за собой весь sway.

desc="сессия sway: waybar, wofi, kanshi, тема, мониторы"

# grim, slurp, wl-copy — скриншоты (~/.local/bin/shot). satty сюда не входит:
# в apt его нет, ставит modules/sway/update.
requires="sway waybar wofi kanshi wtype cliphist dunstctl jq swayidle swaylock brightnessctl grim slurp wl-copy"

scripts="update"
