<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!--
    Моноширинный по умолчанию — JetBrainsMono Nerd Font Mono.
    Сам шрифт ставит ~/.dotfiles/update-tools.sh в ~/.local/share/fonts.

    Одно правило вместо font_family в конфиге каждого приложения: kitty, sway,
    gtk-шные окна берут "monospace" и получают шрифт с Nerd-глифами. Без этого
    иконки в промпте приезжают фолбэком поверх DejaVu Sans Mono — работает, но
    метрики разъезжаются.

    Вариант Mono (NFM), а не обычный: у него иконки ужаты в одну ячейку сетки,
    в терминале они иначе налезают на соседний символ.
  -->
  <alias>
    <family>monospace</family>
    <prefer><family>JetBrainsMono Nerd Font Mono</family></prefer>
  </alias>

</fontconfig>
