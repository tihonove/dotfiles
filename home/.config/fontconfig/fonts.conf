<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!--
    Моноширинный по умолчанию — JetBrainsMono Nerd Font Mono.
    Сам шрифт ставит ~/.dotfiles/update-tools.sh в ~/.local/share/fonts.

    Одно правило вместо font_family в конфиге каждого приложения: kitty, sway,
    gtk-шные окна берут "monospace" и получают шрифт с Nerd-глифами. Без этого
    иконки в промпте приезжают фолбэком поверх DejaVu Sans Mono — работает, но
    метрики разъезжаются.

    Вариант Mono (NFM), а не обычный: у него иконки ужаты в одну ячейку сетки,
    в терминале они иначе налезают на соседний символ.
  -->
  <alias>
    <family>monospace</family>
    <prefer><family>JetBrainsMono Nerd Font Mono</family></prefer>
  </alias>

  <!--
    Emoji-фолбэк. В JetBrainsMono Nerd Font emoji-блоков нет, в DejaVu их почти
    нет тоже: ✅ (U+2705), ❌ (U+274C), 💡 (U+1F4A1) не находились ни в одном
    установленном шрифте и рисовались пустыми квадратами — включая вывод
    скриптов из этой репы.

    accept, а не prefer: Noto Color Emoji дописывается в КОНЕЦ списка. Иначе он
    перехватывал бы символы, которые есть и в основном шрифте (те же ⚠ и ✔),
    и они бы поехали цветными картинками не по метрикам сетки.

    После установки Symbola (блок ниже) его роль сузилась: на общих кодпоинтах
    fontconfig выбирает Symbola, и Noto достаются только эмодзи новее Unicode 9,
    которых в Symbola нет — 🥲 (U+1F972), 🫠 (U+1FAE0) и прочие свежие. Они и
    рисуются цветными. Без Noto они стали бы пустыми квадратами, так что убирать
    его нельзя.
  -->
  <alias>
    <family>monospace</family>
    <accept><family>Noto Color Emoji</family></accept>
  </alias>
  <alias>
    <family>sans-serif</family>
    <accept><family>Noto Color Emoji</family></accept>
  </alias>

  <!--
    Последнее звено цепочки. Symbola ставится системно, пакетом fonts-symbola
    (точная команда — в README, тут нельзя: двойной дефис в ключе apt ломает
    XML-комментарий).

    Закрывает то, чего нет ни в Nerd Font, ни в Noto Color Emoji: блок
    Miscellaneous Technical (256 из 256 кодпоинтов). Оттуда TUI Claude Code
    берёт ⏵ (U+23F5) для строки режима и ⎿ (U+23BF) для дерева под вызовами
    тулов — оба рисовались пустыми квадратами.

    Noto Sans Symbols 2 тут не годится: в нём есть ⏵, но нет ⎿ (37 из 256).
    Symbola — единственный доступный шрифт, закрывающий обе дыры разом.

    Порядок алиасов в этом файле на выбор между Symbola и Noto НЕ влияет —
    проверено через fc-match. Noto Color Emoji растровый (outline=False), и на
    общих кодпоинтах fontconfig всегда ставит векторную Symbola выше, хоть с
    accept, хоть с prefer. Единственный рычаг — binding="strong", но тогда Noto
    перехватывает весь текст вообще, включая буквы. Пробовал, откатил.

    Практический итог: ✅/❌/💡 рисует Symbola, монохромом. Для терминала это
    скорее плюс — одна толщина штриха с текстом и ровно одна клетка сетки,
    без сюрпризов с шириной цветных картинок.

    Алиас только для monospace. В sans-serif Symbola не добавлена, но GUI всё
    равно получает её общим фолбэком fontconfig — отдельный алиас просто ничего
    бы не изменил.
  -->
  <alias>
    <family>monospace</family>
    <accept><family>Symbola</family></accept>
  </alias>

</fontconfig>
