<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!--
    Моноширинный по умолчанию — JetBrainsMono Nerd Font Mono.
    Сам шрифт ставит ~/.dotfiles/update-tools.sh в ~/.local/share/fonts.

    Одно правило вместо font_family в конфиге каждого приложения: kitty, sway,
    gtk-шные окна берут "monospace" и получают шрифт с Nerd-глифами. Без этого
    иконки в промпте приезжают фолбэком поверх DejaVu Sans Mono — работает, но
    метрики разъезжаются.

    Вариант Mono (NFM), а не обычный: у него иконки ужаты в одну ячейку сетки,
    в терминале они иначе налезают на соседний символ.
  -->
  <alias>
    <family>monospace</family>
    <prefer><family>JetBrainsMono Nerd Font Mono</family></prefer>
  </alias>

  <!--
    Emoji-фолбэк. В JetBrainsMono Nerd Font emoji-блоков нет, в DejaVu их почти
    нет тоже: ✅ (U+2705), ❌ (U+274C), 💡 (U+1F4A1) не находились ни в одном
    установленном шрифте и рисовались пустыми квадратами — включая вывод
    скриптов из этой репы.

    accept, а не prefer: Noto Color Emoji дописывается в КОНЕЦ списка. Иначе он
    перехватывал бы символы, которые есть и в основном шрифте (те же ⚠ и ✔),
    и они бы поехали цветными картинками не по метрикам сетки.
  -->
  <alias>
    <family>monospace</family>
    <accept><family>Noto Color Emoji</family></accept>
  </alias>
  <alias>
    <family>sans-serif</family>
    <accept><family>Noto Color Emoji</family></accept>
  </alias>

</fontconfig>
